<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D Drag Racing</title>

<script>

    var canvas;   // The canvas that is used as the drawing surface
    var graphics; // The 2D graphics context for drawing on the canvas.

    var X_LEFT = -4;    // The xy limits for the coordinate system.
    var X_RIGHT = 4;
    var Y_BOTTOM = -3;
    var Y_TOP = 3;
    
    var BACKGROUND = "#00BFFF";  // The display is filled with this color before the scene is drawn.
    /** charcoal = "#36454F"
     * slate grey = "#708090"
     * hot pink = "#FF69B4"
     * DeepSkyBlue = "#00BFFF"
     * LightCyan = "#E0FFFF"
     * DarkSlateBlue = "#483D8B"
     * CornflowerBlue = "#6495ED"
     * FireBrickRed = "#B22222"
     */

    var pixelSize;  // The size of one pixel, in the transformed coordinates.
            
    var frameNumber = 0;  // Current frame number. goes up by one in each frame.

    var world;  // A SceneGraphNode representing the entire scene. 
    
    // TODO: Define global variables to represent animated objects in the scene.
    var sun;
    var player1;
    var player2;

    var leftWheels;
    var rightWheels;
    
    /**
     *  Builds the data structure that represents the entire picture.
     */
    function createWorld() {

        world = new CompoundObject();  // Root node for the scene graph.

        leftWheels = [];
        rightWheels = [];

        // TODO: Create objects and add them to the scene graph.
        const greenery = new TransformedObject(grass);
        world.add(greenery);

        sun = makeSun();
        sun.setTranslation(3,2.5);
        world.add(sun);

        var tree1 = makeTree();
        tree1.setTranslation(-3,1.2);
        tree1.setScale(0.8,0.8);
        world.add(tree1);

        var tree2 = makeTree();
        tree2.setTranslation(-2,1);
        tree2.setScale(1,1);
        world.add(tree2);

        var tree3 = makeTree();
        tree3.setTranslation(1.8,1.7);
        tree3.setScale(0.4,0.4);
        world.add(tree3);

        const road = makeRoad();
        world.add(road);

        player1 = car("black");
        world.add(player1);

        player2 = car("#B22222");
        player2.setTranslation(-1, -1);
        world.add(player2);
    }
    
    /**
     * This method is called just before each frame is drawn.  It updates the modeling
     * transformations of the objects in the scene that are animated.
     */
    function updateFrame() {
        frameNumber++;

        // TODO: Update state in preparation for drawing the next frame.
        sun.setRotation(frameNumber);
        player1.setTranslation(-5 + 12*(frameNumber % 500) / 500.0, 0);
        player2.setTranslation(-5 + 10*(frameNumber % 500) / 500.0, -1);

        for(let i = 0 ; i < 2 ; i++){
            leftWheels[i].setRotation(-frameNumber*4.1);
            rightWheels[i].setRotation(-frameNumber*4.1);
        }
    }


    function makeWheel(){
        const wheel = new CompoundObject();
        const tire = new TransformedObject(circle);
        tire.setColor("black");
        wheel.add(tire);

        const rim = new TransformedObject(smallCircle);
        rim.setColor("white");
        wheel.add(rim);

        for(let i = 0 ; i<6 ; i++){
            const spoke = new TransformedObject(line);
            spoke.setRotation(i*Math.PI/0.1);
            wheel.add(spoke);
        }

        return wheel;
    }

    function car(color){
        var car = new CompoundObject();
        const body = new TransformedObject(carBody);
        body.setTranslation(-1.65,0);
        car.add(body);

        const leftwheel = new TransformedObject(makeWheel());
        leftwheel.setTranslation(-1.2,0);
        leftwheel.setScale(0.5,0.5);
        car.add(leftwheel);
        leftWheels.push(leftwheel);

        const rightWheel = new TransformedObject(makeWheel());
        rightWheel.setTranslation(1.5,0);
        rightWheel.setScale(0.5,0.5);
        car.add(rightWheel);
        rightWheels.push(rightWheel);

        car = new TransformedObject(car);
        car.setScale(0.6, 0.6);
        car.setColor(color);

        return car;
    }

    function makeRoad(){
        const road = new CompoundObject();

        const tempRoad = new TransformedObject(tar);
        tempRoad.setColor("#36454F");
        road.add(tempRoad);

        const lines = new TransformedObject(strip);
        road.add(lines);
        
        return road;
    }

    function makeSun(){
        var sunTemp = new CompoundObject();
        sunTemp.setColor("yellow"); // color for filled circle\
        for (var i = 0; i < 12; i++) {  // add the 12 light rays, with different rotations, colored orange
           sunTemp.add( new TransformedObject(line).setScale(1.5, 1.5).setRotation(i*30).setColor("#DD8800") );
        }
        sunTemp.add( filledCircle );  // the face of the sun
        sunTemp.add( new TransformedObject(circle).setColor("#DD8800") ); // outlines the face
        return (new TransformedObject(sunTemp));
    }

    function makeTree(){
        var tree = new CompoundObject();

        var trunk = new TransformedObject(bark);
        trunk.setColor("brown");
        tree.add(trunk);

        var leaf1 = new TransformedObject(filledCircle);
        leaf1.setColor("green");
        leaf1.setScale(0.7, 0.7);
        leaf1.setTranslation(0, 1.3);
        tree.add(leaf1);

        var leaf2 = new TransformedObject(filledCircle);
        leaf2.setColor("green");
        leaf2.setScale(0.7, 0.7);
        leaf2.setTranslation(0.2, 1.7);
        tree.add(leaf2);

        var leaf3 = new TransformedObject(filledCircle);
        leaf3.setColor("green");
        leaf3.setScale(0.7, 0.7);
        leaf3.setTranslation(0.5, 1.3);
        tree.add(leaf3);


        tree = new TransformedObject(tree);
        return tree;
    }
 

    //------------------- A Simple Scene Object-Oriented Scene Graph API ----------------
    
    /**
     * The (abstract) base class for all nodes in the scene graph data structure.
     */
    function SceneGraphNode() {
        this.fillColor = null;   // If non-null, the default fillStyle for this node.
        this.strokeColor = null; // If non-null, the default strokeStyle for this node.
    }
    SceneGraphNode.prototype.doDraw = function(g) {
            // This method is meant to be abstract and must be OVERRIDDEN in an actual
            // object. It is not meant to be called; it is called by draw().
        throw "doDraw not implemented in SceneGraphNode"
    }
    SceneGraphNode.prototype.draw = function(g) {
           // This method should be CALLED to draw the object It should NOT
           // ordinarily be overridden in subclasses.
        graphics.save();
        if (this.fillColor) {
            g.fillStyle = this.fillColor;
        }
        if (this.strokeColor) {
            g.strokeStyle = this.strokeColor;
        }
        this.doDraw(g);
        graphics.restore();
    }
    SceneGraphNode.prototype.setFillColor = function(color) {
            // Sets fillColor for this node to color.
            // Color should be a legal CSS color string, or null.
        this.fillColor = color;
        return this;
    }
    SceneGraphNode.prototype.setStrokeColor = function(color) {
            // Sets strokeColor for this node to color.
            // Color should be a legal CSS color string, or null.
        this.strokeColor = color;
        return this;
    }
    SceneGraphNode.prototype.setColor = function(color) {
            // Sets both the fillColor and strokeColor to color.
            // Color should be a legal CSS color string, or null.
        this.fillColor = color;
        this.strokeColor = color;
        return this;
    }
    
    /**
     *  Defines a subclass, CompoundObject, of SceneGraphNode to represent
     *  an object that is made up of sub-objects.  Initially, there are no
     *  sub-objects.  Objects are added with the add() method.
     */
    function CompoundObject() {
        SceneGraphNode.call(this);  // do superclass initialization
        this.subobjects = [];  // the list of sub-objects of this object
    }
    CompoundObject.prototype = new SceneGraphNode(); // (makes it a subclass!)
    CompoundObject.prototype.add = function(node) {
        this.subobjects.push(node);
        return this;
    }
    CompoundObject.prototype.doDraw = function(g) {
            // Just call the sub-objects' draw() methods.
        for (var i = 0; i < this.subobjects.length; i++)
            this.subobjects[i].draw(g);
    }
    
    /**
     *  Define a subclass, TransformedObject, of SceneGraphNode that
     *  represents an object along with a modeling transformation to
     *  be applied to that object.  The object must be specified in
     *  the constructor.  The transformation is specified by calling
     *  the setScale(), setRotate() and setTranslate() methods. Note that
     *  each of these methods returns a reference to the TransformedObject
     *  as its return value, to allow for chaining of method calls.
     *  The modeling transformations are always applied to the object
     *  in the order scale, then rotate, then translate.
     */
    function TransformedObject(object) {
        SceneGraphNode.call(this);  // do superclass initialization
        this.object = object;
        this.rotationInDegrees = 0;
        this.scaleX = 1;
        this.scaleY = 1;
        this.translateX = 0;
        this.translateY = 0;
    }
    TransformedObject.prototype = new SceneGraphNode();  // (makes it a subclass!)
    TransformedObject.prototype.setRotation = function(angle) {
           // Set the angle of rotation, measured in DEGREES.  The rotation
           // is always about the origin.
        this.rotationInDegrees = angle;
        return this;
    }
    TransformedObject.prototype.setScale = function(sx, sy) {
           // Sets scaling factors.
        this.scaleX = sx;
        this.scaleY = sy;
        return this;
    }
    TransformedObject.prototype.setTranslation = function(dx,dy) {
           // Set translation mounts.
        this.translateX = dx;
        this.translateY = dy;
        return this;
    }
    TransformedObject.prototype.doDraw = function(g) {
            // Draws the object, with its modeling transformation.
        g.save();
        if (this.translateX != 0 || this.translateY != 0) {
            g.translate(this.translateX, this.translateY);
        }
        if (this.rotationInDegrees != 0) {
            g.rotate(this.rotationInDegrees/180*Math.PI);
        }
        if (this.scaleX != 1 || this.scaleY != 1) {
            g.scale(this.scaleX, this.scaleY);
        }
        this.object.draw(g);
        g.restore();
    }
    
           // Create some basic shapes as custom SceneGraphNode objects.
           
    var line = new SceneGraphNode();  // Line from (-0.5,0) to (0.5,0)
    line.doDraw = function(g) {
        g.beginPath();
        g.moveTo(-0.5,0);
        g.lineTo(0.5,0);
        g.stroke();
    }
    
    var filledRect = new SceneGraphNode();  // Filled square, size = 1, center = (0,0)
    filledRect.doDraw = function(g) {
        g.fillRect(-0.5,-0.5,1.5,0.5);
    }
    
    var rect = new SceneGraphNode(); // Stroked square, size = 1, center = (0,0)
    rect.doDraw = function(g) {
        g.strokeRect(-0.5,-0.5,1,1);
    }
    
    var filledCircle = new SceneGraphNode(); // Filled circle, diameter = 1, center = (0,0)
    filledCircle.doDraw = function(g) {
        g.beginPath();
        g.arc(0,0,0.5,0,2*Math.PI);
        g.fill();
    }

    //added
    var smallCircle = new SceneGraphNode();
    smallCircle.doDraw = function(g){
        g.beginPath();
        g.arc(0,0,0.5,0,2*Math.PI);
        g.fill();
    }

    var carBody = new SceneGraphNode();
    carBody.doDraw = function(g){
        g.beginPath();
        g.moveTo(0,0);
        g.lineTo(0,0.6);
        g.lineTo(0.3, 0.6);
        g.lineTo(0.8,1.1);
        g.lineTo(2, 1.1);
        g.lineTo(3,0.6);
        g.lineTo(3.7 , 0.6);
        g.lineTo(3.7,0);
        g.closePath();
        g.fill();
    }

    var tar = new SceneGraphNode();
    tar.doDraw = function(g){
        g.fillRect(-4,-2,8,3);
    }

    var strip = new SceneGraphNode();
    strip.doDraw = function(g){
        g.fillStyle = "white";
        g.fillRect(-4,-0.5,2.5,0.1);
        g.fillRect(0,-0.5,3.5,0.1);
    }

    var grass = new SceneGraphNode();
    grass.doDraw = function(g){
        g.fillStyle = "green"; 
        g.fillRect(-4,-3,8,2);
        g.fillRect(-4, 1, 8, 0.8);
    }

    var bark = new SceneGraphNode();
    bark.doDraw = function(g){
        g.fillStyle = "brown";
        g.fillRect(0,0,0.5,1.3);
    }

    //end
    
    var circle = new SceneGraphNode();// Stroked circle, diameter = 1, center = (0,0)
    circle.doDraw = function(g) {
        g.beginPath();
        g.arc(0,0,0.5,0,2*Math.PI);
        g.stroke();
    }
    
    var filledTriangle = new SceneGraphNode(); // Filled Triangle, width 1, height 1, center of base at (0,0)
    filledTriangle.doDraw = function(g) {
        g.beginPath();
        g.moveTo(-0.5,0);
        g.lineTo(0.5,0);
        g.lineTo(0,1);
        g.closePath();
        g.fill();
    }   
    
   
    
    // ------------------------------- graphics support functions --------------------------
    
    /**
      * Draw one frame of the animation.  Probably doesn't need to be changed,
      * except maybe to change the setting of preserveAspect in applyLimits().
      */
    function draw() {
        graphics.save();  // to make sure changes don't carry over from one call to the next
        graphics.fillStyle = BACKGROUND;  // background color
        graphics.fillRect(0,0,canvas.width,canvas.height);
        graphics.fillStyle = "black";
        applyLimits(graphics,X_LEFT,X_RIGHT,Y_TOP,Y_BOTTOM,false);
        graphics.lineWidth = pixelSize;  // Use 1 pixel as the default line width
        world.draw(graphics);
        graphics.restore();
    }
    
    /**
     * Applies a coordinate transformation to the graphics context, to map
     * xleft,xright,ytop,ybottom to the edges of the canvas.  This is called
     * by draw().  This does not need to be changed.
     */
    function applyLimits(g, xleft, xright, ytop, ybottom, preserveAspect) {
       var width = canvas.width;   // The width of this drawing area, in pixels.
       var height = canvas.height; // The height of this drawing area, in pixels.
       if (preserveAspect) {
             // Adjust the limits to match the aspect ratio of the drawing area.
          var displayAspect = Math.abs(height / width);
          var requestedAspect = Math.abs(( ybottom-ytop ) / ( xright-xleft ));
          var excess;
          if (displayAspect > requestedAspect) {
             excess = (ybottom-ytop) * (displayAspect/requestedAspect - 1);
             ybottom += excess/2;
             ytop -= excess/2;
          }
          else if (displayAspect < requestedAspect) {
             excess = (xright-xleft) * (requestedAspect/displayAspect - 1);
             xright += excess/2;
             xleft -= excess/2;
          }
       }
       var pixelWidth = Math.abs(( xright - xleft ) / width);
       var pixelHeight = Math.abs(( ybottom - ytop ) / height);
       pixelSize = Math.min(pixelWidth,pixelHeight);
       g.scale( width / (xright-xleft), height / (ybottom-ytop) );
       g.translate( -xleft, -ytop );
    }
    
    
    //------------------ Animation framework ------------------------------
    
    var running = false;  // This is set to true when animation is running
    
    function frame() {
        if (running) {
               // Draw one frame of the animation, and schedule the next frame.
            updateFrame();
            draw();
            requestAnimationFrame(frame);
        }
    }
    
    function doAnimationCheckbox() { 
        var shouldRun = document.getElementById("animateCheck").checked;
        if ( shouldRun != running ) {
            running = shouldRun;
            if (running)
                requestAnimationFrame(frame);
        }
    }
    
    //----------------------- initialization -------------------------------

    function init() {
        canvas = document.getElementById("thecanvas");
        if (!canvas.getContext) {
            document.getElementById("message").innerHTML = "ERROR: Canvas not supported";
            return;
        }
        graphics = canvas.getContext("2d");
        document.getElementById("animateCheck").checked = false; 
        document.getElementById("animateCheck").onchange = doAnimationCheckbox; 
        createWorld();
        draw();
    }

</script>

</head>

<body onload="init()" style="background-color:#EEEEEE">

<h3>Drag Racing 2D</h3>

<noscript>

</div>


</body>
</html>
